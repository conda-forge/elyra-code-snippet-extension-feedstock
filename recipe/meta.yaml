{% set name = "elyra-code-snippet-extension" %}
{% set version = "4.2.0" %}


package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/{{ name | replace('-', '_') }}-{{ version }}.tar.gz
  sha256: 1a48f326609ef715f106d071cee33535bea0abaa69298f9a29443e2552d331d3

build:
  number: 0
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - jupyter-packaging
    - pip
    - python {{ python_min }}
  run:
    - elyra-server =={{ version }}
    - python >={{ python_min }}

test:
  requires:
    - python {{ python_min }}
  commands:
    - exit 0

about:
  home: https://github.com/elyra-ai/elyra
  summary: Elyra JupyterLab extension providing support for Code Snippets. Learn more at https://elyra.readthedocs.io/en/stable/user_guide/code-snippets.html
  license: Apache-2.0
  license_file: LICENSE

extra:
  recipe-maintainers:
    - akchinSTC
    - lresende
